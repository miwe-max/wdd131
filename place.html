<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore Nigeria's culture, weather, attractions, and essential country information. Discover the beauty and diversity of Nigeria.">
    <meta name="author" content="Maxwell Iwe">
    <title>Visit Nigeria: Discover the Beauty and Culture of Nigeria</title>
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/windchill.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Poppins:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Nigeria</h1>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/nigeria.webp">
                <source media="(min-width: 750px)" srcset="images/nigeria-medium.webp">
                <img src="images/nigeria-small.webp" alt="Beautiful Nigerian cultural landscape">
            </picture>
        </div>

        <section class="card data">
            <h2>Data</h2>
            <div class="col-2">
                <span class="label">Area:</span>
                <span class="value">923,768 sq km</span>
                <span class="label">Population:</span>
                <span class="value">243,000,000</span>
                <span class="label">Capital:</span>
                <span class="value">Abuja</span>
                <span class="label">Languages:</span>
                <span class="value">English, Ibo</span>
                <span class="label">Currency:</span>
                <span class="value">Nigeria Naira (NGN ₦)</span>
                <span class="label">Time Zone:</span>
                <span class="value">GMT</span>
                <span class="label">Calling Code:</span>
                <span class="value">+234</span>
                <span class="label">Internet TLD:</span>
                <span class="value">.ng</span>
            </div>
        </section>

        <section class="card weather">
            <h2>Weather</h2>
            <img src="images/weather.svg" alt="weather icon" class="weather-icon">
            <div class="col-2">
                <span class="label">Temperature:</span>
                <span class="value">30 C</span>
                <span class="label">Conditions:</span>
                <span class="value">Sunny</span>
                <span class="label">Wind:</span>
                <span class="value">10km/h</span>
                <span class="label">Wind Chill:</span>
                <span class="value" id="wcf"></span>
            </div>
        </section>
    </main>

    <footer>
        <p>© <span id="currentYear"></span> 💻 Maxwell Iwe 💻 Nigeria</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
