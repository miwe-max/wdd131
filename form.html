<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your product review and help us improve our services.">
    <title>Product Review Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <meta name="author" content="Maxwell Iwe">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Product Review</h1>
        </header>

        <main>
            <form id="reviewForm" action="review.html" method="get">

                <div class="form-group">
                    <label for="productName">
                        Product Name <span class="required">*</span>
                    </label>

                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        Overall Rating <span class="required">*</span>
                    </label>

                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">☆</label>

                        <input type="radio" id="star4" name="rating" value="4" required>
                        <label for="star4" title="4 stars">☆</label>

                        <input type="radio" id="star3" name="rating" value="3" required>
                        <label for="star3" title="3 stars">☆</label>

                        <input type="radio" id="star2" name="rating" value="2" required>
                        <label for="star2" title="2 stars">☆</label>

                        <input type="radio" id="star1" name="rating" value="1" required>
                        <label for="star1" title="1 star">☆</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="installDate">
                        Date of Installation <span class="required">*</span>
                    </label>

                    <input type="date" id="installDate" name="installDate" required>
                </div>

                <div class="form-group">
                    <label>
                        Which features did you find useful in the product?
                        <span class="optional">(Check all that apply)</span>
                    </label>

                    <div class="checkbox-group">

                        <div class="checkbox-item">
                            <input type="checkbox" id="durability" name="features" value="Durability">
                            <label for="durability">Durability</label>
                        </div>

                        <div class="checkbox-item">
                            <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                            <label for="easeOfUse">Ease of Use</label>
                        </div>

                        <div class="checkbox-item">
                            <input type="checkbox" id="performance" name="features" value="Performance">
                            <label for="performance">Performance</label>
                        </div>

                        <div class="checkbox-item">
                            <input type="checkbox" id="design" name="features" value="Design">
                            <label for="design">Design</label>
                        </div>

                    </div>
                </div>

                <div class="form-group">
                    <label for="review">
                        Written Review <span class="optional">(Optional)</span>
                    </label>

                    <textarea id="review" name="review" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="userName">
                        Your Name <span class="optional">(Optional)</span>
                    </label>

                    <input type="text" id="userName" name="userName">
                </div>

                <button type="submit">Post Review</button>

            </form>
        </main>
    </div>

    <footer>
        <p>©2026 💻 Maxwell Iwe 💻 Nigeria</p>
        <p>Last Modification: <span id="lastModified"></span></p>
        <p>Reviews submitted: <span id="reviewCount">0</span></p>
    </footer>

    <script src="scripts/script.js" defer></script>
</body>

</html>
